services:
  - type: web
    name: classic-rides-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
      - key: JWT_SECRET
        sync: false
